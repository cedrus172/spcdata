<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danh sách tài khoản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          boxShadow: { soft: '0 10px 25px rgba(0,0,0,0.08)' }
        }
      }
    }
  </script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script> -->
  <style>
    html { scroll-behavior: smooth; }
    img[data-fallback="true"] { background: #f1f5f9; }
  </style>

  <script>
function openProfileModal(url) {
  const m = document.getElementById('profileModal');
  const frame = document.getElementById('profileFrame');
  frame.src = url;
  m.classList.remove('hidden');
  m.classList.add('flex');
}

function closeProfileModal() {
  const m = document.getElementById('profileModal');
  const frame = document.getElementById('profileFrame');
  frame.src = ""; // clear để tránh load lại khi ẩn
  m.classList.add('hidden');
  m.classList.remove('flex');
}
// LƯU Ý: KHÔNG gắn addEventListener ở đây vì script này nằm trong <head>,
// chạy trước khi nút #closeProfileModal tồn tại -> sẽ lỗi null. Gắn ở cuối <body>.
</script>

</head>
  <!-- Modal hồ sơ -->
<div id="profileModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-lg max-w-4xl w-[92vw] h-[85vh] p-4 relative flex flex-col">
    <button id="closeProfileModal" class="absolute top-2 right-2 bg-slate-100 rounded-full p-1">✕</button>
    <h3 class="text-lg font-semibold mb-2">Hồ sơ SportConnect</h3>
    <iframe id="profileFrame" class="w-full flex-1 rounded-xl border border-slate-200"></iframe>
  </div>
</div>
<body class="bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-10 bg-white/80 backdrop-blur shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Danh sách tài khoản</h1>
        <button id="toggleFilters" class="md:hidden bg-indigo-600 text-white px-3 py-2 rounded-xl text-sm">
  Bộ lọc
</button>

        <p class="text-sm text-slate-500">Nguồn: <code id="sourceLabel">newdata.txt</code></p>
      </div>
     <div id="filterWrapper" class="hidden md:block">
  <form id="filters" class="grid grid-cols-1 md:grid-cols-7 gap-3 w-full md:w-auto">
        <label class="block">
          <span class="text-xs font-medium text-slate-600">Nguồn dữ liệu</span>
          <select id="source" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="new">SportConnect</option>
            <option value="d2">VNPA</option>
            <option value="d3">PickleVN</option>
            <!-- <option value="both">Cả hai (SC + VNPA)</option> -->
            <option value="all">Tất cả</option>
          </select>
        </label>
        <label class="block">
          <span class="text-xs font-medium text-slate-600">Tìm theo họ tên, biệt danh, SĐT hoặc email</span>
          <input id="q" type="search" placeholder="vd: Nam Béo, 0852…, an@gmail.com" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </label>
        <label class="block">
          <span class="text-xs font-medium text-slate-600">Tỉnh/Thành</span>
          <select id="province" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Tất cả</option>
          </select>
        </label>
        <label class="block">
          <span class="text-xs font-medium text-slate-600">Giới tính</span>
          <select id="gender" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Tất cả</option>
            <option value="1">Nam</option>
            <option value="2">Nữ</option>
            <option value="3">Khác/Ẩn</option>
          </select>
        </label>
        <label class="block">
          <span class="text-xs font-medium text-slate-600">Điểm từ</span>
          <input id="scoreMin" type="number" step="0.1" placeholder="VD: 2.5" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </label>
        <label class="block">
          <span class="text-xs font-medium text-slate-600">Đến</span>
          <input id="scoreMax" type="number" step="0.1" placeholder="VD: 4.0" class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </label>
        <div class="flex items-end gap-2">
          <button type="button" id="clearBtn" class="w-full rounded-xl bg-slate-100 px-4 py-2 text-sm font-medium hover:bg-slate-200">Xóa lọc</button>
        </div>
      </form>
     </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <section class="mb-4 grid grid-cols-2 md:grid-cols-4 gap-3" id="stats"></section>
    <div id="resultInfo" class="text-sm text-slate-600 mb-4"></div>
    <section id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></section>
    <nav id="pagination" class="mt-6 flex flex-wrap items-center gap-2"></nav>
  </main>

  <template id="cardTpl">
    <article class="bg-white rounded-2xl shadow-soft overflow-hidden transition hover:-translate-y-0.5 hover:shadow-lg">
      <div class="p-4 flex items-center gap-4">
        <img class="h-14 w-14 rounded-full object-cover ring-1 ring-slate-200 cursor-pointer" alt="avatar" />
        <div class="min-w-0">
          <h3 class="font-semibold truncate" data-nick></h3>
          <p class="text-sm text-slate-700 truncate" data-fullname></p>
          <p class="text-xs text-slate-500 truncate" data-province></p>
          <p class="text-xs mt-0.5">
            <a data-phone class="text-indigo-600 hover:underline break-all"></a>
          </p>
          <p class="text-xs mt-0.5 text-slate-500 break-all" data-email></p>
          <p class="mt-1 text-xs flex items-center gap-2">
            <span class="inline-block rounded-lg bg-slate-100 px-2 py-0.5" data-gender-chip></span>
            <span class="inline-block rounded-lg bg-slate-100 px-2 py-0.5" data-source-chip></span>
          </p>
        </div>
      </div>
      <div class="border-t border-slate-100 grid grid-cols-3 text-center">
        <div class="p-3">
          <p class="text-xs text-slate-500">Điểm đơn</p>
          <p class="font-semibold" data-diemdon>-</p>
        </div>
        <div class="p-3">
          <p class="text-xs text-slate-500">Điểm đôi</p>
          <p class="font-semibold" data-diemdoi>-</p>
        </div>
        <div class="p-3">
          <p class="text-xs text-slate-500">Trung bình</p>
          <p class="font-semibold" data-avg>-</p>
        </div>
      </div>
     <div class="border-t border-slate-100 p-3">
        <div class="flex gap-2">
          <button type="button" data-ach-btn
            class="flex-1 text-sm rounded-xl bg-indigo-600 text-white py-2 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            Xem thành tích
          </button>
          <a data-profile-link
            class="flex-1 text-center text-sm rounded-xl bg-slate-100 text-slate-800 py-2 hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            target="_blank" rel="noopener">
            Xem hồ sơ
          </a>
        </div>
      </div>
    </article>
  </template>

  <!-- Modal ảnh -->
  <div id="imageModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
    <div class="relative">
      <button id="closeModal" class="absolute top-2 right-2 bg-white rounded-full p-1 text-slate-800">✕</button>
      <img id="modalImg" src="" class="max-h-[90vh] max-w-[90vw] rounded-xl shadow-lg" />
    </div>
  </div>

  <!-- Modal thành tích -->
  <div id="achModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl shadow-lg max-w-2xl w-[92vw] p-4 relative">
      <button id="closeAchModal" class="absolute top-2 right-2 bg-slate-100 rounded-full p-1">✕</button>
      <h3 class="text-lg font-semibold mb-2">Thành tích</h3>
      <div id="achBody" class="max-h-[70vh] overflow-auto"></div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 50;
    const state = {
      rawNew: [],
      rawD2: [],
      rawD3: [],
      raw: [],
      filtered: [],
      page: 1,
      q: '',
      province: '',
      gender: '',
      source: 'new',
      scoreMin: '',
      scoreMax: ''
    };
    const genderMap = (n) => ({ 1: 'Nam', 2: 'Nữ', 3: 'Khác/Ẩn' }[Number(n)] || 'Khác/Ẩn');

    // Chuẩn hoá để tìm kiếm: thường hoá, bỏ dấu tiếng Việt (đ -> d), gộp khoảng trắng
    function normText(s) {
      return (s ?? '').toString()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .toLowerCase().replace(/\s+/g, ' ').trim();
    }

    // Gom biệt danh + họ tên thành các trường dùng chung cho hiển thị và tìm kiếm
    function buildNames(nickRaw, fullRaw, emailRaw) {
      const nickName = (nickRaw ?? '').toString().trim();
      const fullName = (fullRaw ?? '').toString().trim();
      const email = (emailRaw ?? '').toString().trim();
      return {
        nickName, fullName, email,
        name: nickName || fullName || 'Không tên',
        searchNick: normText(nickName),
        searchFull: normText(fullName),
        searchEmail: email.toLowerCase()
      };
    }

    const rankMap = { GiaiNhat: 'Giải Nhất 🥇', GiaiNhi: 'Giải Nhì 🥈', GiaiBa: 'Giải Ba 🥉' };

    function fmtDateISOToVN(d) {
      if (!d) return '';
      const dt = new Date(d);
      return new Intl.DateTimeFormat('vi-VN', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      }).format(dt);
    }

    function openAchModal() {
      const m = document.getElementById('achModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeAchModal() {
      const m = document.getElementById('achModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    async function fetchAchievements(userId) {
      const url = `https://apispc.pickletour.vn/user/tournamentHistory/achievement/${userId}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function renderAchievements(payload) {
      const box = document.getElementById('achBody');
      if (!payload || !Array.isArray(payload.achievementHistory) || payload.achievementHistory.length === 0) {
        box.innerHTML = `<p class="text-sm text-slate-600">Không có dữ liệu thành tích.</p>`;
        return;
      }
      const items = payload.achievementHistory
        .sort((a, b) => new Date(b.startDate) - new Date(a.startDate))
        .map(a => {
          const rank = rankMap[a.HangGiai] || a.HangGiai || '';
          const mate = a.HoVaTenDongDoi ? ` • Đồng đội: <span class="font-medium">${a.HoVaTenDongDoi}</span>` : '';
          return `
          <article class="border border-slate-200 rounded-xl p-3 hover:bg-slate-50">
            <h4 class="font-semibold text-sm">${a.Name}</h4>
            <p class="text-xs text-slate-600 mt-0.5">${a.location || ''}</p>
            <p class="text-xs mt-1">
              <span class="inline-block rounded-lg bg-indigo-50 text-indigo-700 px-2 py-0.5">${rank}</span>
              • ${fmtDateISOToVN(a.startDate)}${mate}
            </p>
          </article>`;
        }).join('');
      box.innerHTML = `<div class="grid gap-2">${items}</div>`;
    }

    // Chuẩn hóa từ newdata.txt
    function normalizeUserNew(u) {
      const names = buildNames(u.NickName, u.HoVaTen, u.Email);
      const province = (u.TinhThanh && u.TinhThanh !== '--') ? u.TinhThanh : 'Không rõ';
      const avatar = u.HinhDaiDien && u.HinhDaiDien.trim() ? u.HinhDaiDien.trim() : 'https://via.placeholder.com/96x96?text=%20';
      const g = 3; // không có giới tính
      const diemDon = typeof u.DiemDon === 'number' ? u.DiemDon : null;
      const diemDoi = typeof u.DiemDoi === 'number' ? u.DiemDoi : null;
      const avg = (diemDon != null && diemDoi != null)
        ? Number(((diemDon + diemDoi) / 2).toFixed(3))
        : (diemDon ?? diemDoi ?? null);
      const phoneRaw = (u.Phone ?? '').toString().trim();
      const phoneDigits = phoneRaw.replace(/\D/g, '');
      return {
        id: u.ID, idType: 'new', ...names, province, avatar,
        gender: g, genderText: genderMap(g),
        diemDon, diemDoi, avg,
        phone: phoneRaw, phoneDigits
      };
    }

    // Chuẩn hóa từ data2.txt
    function normalizeUserD2(u) {
      const names = buildNames(u.nickName, u.fullName, u.email);
      const province = 'Không rõ';
      const avatar = 'https://via.placeholder.com/96x96?text=%20';
      const gRaw = (u.gender == null || Number(u.gender) === 0) ? 3 : Number(u.gender); // 1 Nam, 2 Nữ, 0/null -> 3
      const diemDon = (typeof u.point === 'number') ? u.point : null;
      const diemDoi = (typeof u.doublePoint === 'number') ? u.doublePoint : null;
      const avg = (diemDon != null && diemDoi != null)
        ? Number(((diemDon + diemDoi) / 2).toFixed(3))
        : (diemDon ?? diemDoi ?? null);
      const phoneRaw = (u.phoneNumber ?? '').toString().trim();
      const phoneDigits = phoneRaw.replace(/\D/g, '');
      return {
        id: u.id, idType: 'd2', ...names, province, avatar,
        gender: gRaw, genderText: genderMap(gRaw),
        diemDon, diemDoi, avg,
        phone: phoneRaw, phoneDigits
      };
    }

    // Chuẩn hóa từ data3.txt (PickleVN)
    function normalizeUserD3(u) {
      const names = buildNames(u.username, u.name, u.email);
      const province = 'Không rõ';
      const avatar = u.avatar_src && u.avatar_src.trim()
        ? u.avatar_src.trim()
        : 'https://via.placeholder.com/96x96?text=%20';
      const g = 3; // không có giới tính
      const diemDon = null;
      const diemDoi = (typeof u.double_point === 'number') ? u.double_point : null;
      const avg = diemDoi ?? null;
      const phoneRaw = (u.phone ?? '').toString().trim();
      const phoneDigits = phoneRaw.replace(/\D/g, '');
      return {
        id: u.id, idType: 'd3', ...names, province, avatar,
        gender: g, genderText: genderMap(g),
        diemDon, diemDoi, avg,
        phone: phoneRaw || '', phoneDigits
      };
    }

    async function load() {
      try {
        const [resNew, resD2, resD3] = await Promise.allSettled([
          fetch('newdata.txt', { cache: 'no-store' }),
          fetch('data2.txt', { cache: 'no-store' }),
          fetch('data3.txt', { cache: 'no-store' })
        ]);

        // newdata.txt
        if (resNew.status === 'fulfilled' && resNew.value.ok) {
          const text = await resNew.value.text();
          try {
            const json = JSON.parse(text);
            state.rawNew = Array.isArray(json) ? json.map(normalizeUserNew) : [];
          } catch {
            state.rawNew = [];
          }
        } else {
          state.rawNew = [];
        }

        // data2.txt
        if (resD2.status === 'fulfilled' && resD2.value.ok) {
          const text2 = await resD2.value.text();
          try {
            const json2 = JSON.parse(text2);
            state.rawD2 = Array.isArray(json2) ? json2.map(normalizeUserD2) : [];
          } catch {
            state.rawD2 = [];
          }
        } else {
          state.rawD2 = [];
        }

        // data3.txt
        if (resD3.status === 'fulfilled' && resD3.value.ok) {
          const text3 = await resD3.value.text();
          try {
            const json3 = JSON.parse(text3);
            state.rawD3 = Array.isArray(json3) ? json3.map(normalizeUserD3) : [];
          } catch {
            state.rawD3 = [];
          }
        } else {
          state.rawD3 = [];
        }

        applySource();
        initFilters();
        applyFilters();
      } catch (e) {
        document.getElementById('resultInfo').textContent = 'Lỗi: ' + e.message;
      }
    }

    // Hợp nhất hoặc chọn nguồn
    function applySource() {
      const srcSel = state.source;
      const label = document.getElementById('sourceLabel');

      if (srcSel === 'new') {
        state.raw = state.rawNew.slice();
        label.textContent = 'newdata.txt';
      } else if (srcSel === 'd2') {
        state.raw = state.rawD2.slice();
        label.textContent = 'data2.txt';
      } else if (srcSel === 'd3') {
        state.raw = state.rawD3.slice();
        label.textContent = 'data3.txt';
      } else if (srcSel === 'both') { // new + d2
        const map = new Map();
        const ingest = (arr) => {
          for (const u of arr) {
            const key = u.phoneDigits || (u.name + '|' + u.id + '|' + u.idType);
            const existing = map.get(key);
            if (!existing) map.set(key, u);
            else {
              const scoreExisting = (existing.diemDon != null) + (existing.diemDoi != null);
              const scoreNew = (u.diemDon != null) + (u.diemDoi != null);
              if (scoreNew > scoreExisting) map.set(key, u);
            }
          }
        };
        ingest(state.rawNew);
        ingest(state.rawD2);
        state.raw = Array.from(map.values());
        label.textContent = 'newdata.txt + data2.txt';
      } else { // all: new + d2 + d3
        const map = new Map();
        const ingest = (arr) => {
          for (const u of arr) {
            const key = u.phoneDigits || (u.name + '|' + u.id + '|' + u.idType);
            const existing = map.get(key);
            if (!existing) map.set(key, u);
            else {
              const scoreExisting = (existing.diemDon != null) + (existing.diemDoi != null);
              const scoreNew = (u.diemDon != null) + (u.diemDoi != null);
              if (scoreNew > scoreExisting) map.set(key, u);
            }
          }
        };
        ingest(state.rawNew);
        ingest(state.rawD2);
        ingest(state.rawD3);
        state.raw = Array.from(map.values());
        label.textContent = 'newdata.txt + data2.txt + data3.txt';
      }
    }

    function initFilters() {
      const provinces = Array.from(new Set(state.raw.map(u => u.province)))
        .sort((a, b) => a.localeCompare(b, 'vi'));
      const select = document.getElementById('province');
      select.innerHTML = '<option value="">Tất cả</option>';
      provinces.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p === 'Không rõ' ? '' : p;
        opt.textContent = p;
        select.appendChild(opt);
      });
    }

    function applyFilters() {
      const qRaw = state.q || '';
      const q = normText(qRaw);                 // dùng so với họ tên / biệt danh (không phân biệt dấu)
      let qDigits = qRaw.replace(/\D/g, '');   // dùng so với SĐT
      if (qDigits.startsWith('84') && qDigits.length > 9) qDigits = '0' + qDigits.slice(2); // +84xxx -> 0xxx
      const hasLetters = /[a-z]/.test(q);
      const hasDigits = qDigits.length > 0;
      const gender = state.gender;
      const province = state.province;

      const scoreMin = state.scoreMin;
      const scoreMax = state.scoreMax;
      const minVal = scoreMin !== '' ? parseFloat(scoreMin) : null;
      const maxVal = scoreMax !== '' ? parseFloat(scoreMax) : null;

      state.filtered = state.raw.filter(u => {
        // Có chữ  -> khớp biệt danh HOẶC họ tên HOẶC email (email/biệt danh có thể chứa số)
        // Chỉ số  -> khớp số điện thoại
        const nameOk = hasLetters && (
          u.searchNick.includes(q) ||
          u.searchFull.includes(q) ||
          (u.searchEmail && u.searchEmail.includes(q))
        );
        const phoneOk = !hasLetters && hasDigits && !!u.phoneDigits && u.phoneDigits.includes(qDigits);
        const queryOk = (!hasLetters && !hasDigits) || nameOk || phoneOk;

        const byProvince = !province || u.province === province;
        const byGender = !gender || String(u.gender) === String(gender);

        const inScoreRange =
          (minVal === null && maxVal === null) ||
          (
            u.avg != null &&
            (minVal === null || u.avg >= minVal) &&
            (maxVal === null || u.avg <= maxVal)
          );

        return queryOk && byProvince && byGender && inScoreRange;
      });

      state.page = 1;
      render();
    }

    function render() {
      const total = state.filtered.length;
      const nam = state.filtered.filter(u => Number(u.gender) === 1).length;
      const nu = state.filtered.filter(u => Number(u.gender) === 2).length;
      const khac = total - nam - nu;

      document.getElementById('stats').innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-soft">
          <p class="text-xs text-slate-500">Tổng</p>
          <p class="text-2xl font-bold">${total}</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-soft">
          <p class="text-xs text-slate-500">Nam</p>
          <p class="text-2xl font-bold">${nam}</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-soft">
          <p class="text-xs text-slate-500">Nữ</p>
          <p class="text-2xl font-bold">${nu}</p>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-soft">
          <p class="text-xs text-slate-500">Khác/Ẩn</p>
          <p class="text-2xl font-bold">${khac}</p>
        </div>
      `;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const start = (state.page - 1) * PAGE_SIZE;
      const pageItems = state.filtered.slice(start, start + PAGE_SIZE);
      const tpl = document.getElementById('cardTpl');

      for (const u of pageItems) {
        const node = tpl.content.cloneNode(true);
        const img = node.querySelector('img');
        img.src = u.avatar;
        img.setAttribute('data-fallback', 'true');
        img.onerror = () => { img.src = 'https://via.placeholder.com/96x96?text=%20'; };
        img.addEventListener('click', () => showImage(u.avatar));

        // Dòng 1: biệt danh (nếu không có thì họ tên). Dòng 2: họ tên (khi khác biệt danh)
        const nickEl = node.querySelector('[data-nick]');
        const fullEl = node.querySelector('[data-fullname]');
        nickEl.textContent = u.nickName || u.fullName || 'Không tên';
        nickEl.title = nickEl.textContent;
        if (u.fullName && u.nickName && normText(u.fullName) !== normText(u.nickName)) {
          fullEl.textContent = u.fullName;
          fullEl.title = u.fullName;
        } else {
          fullEl.classList.add('hidden');
        }
        node.querySelector('[data-province]').textContent = u.province;

        const phoneEl = node.querySelector('[data-phone]');
        if (u.phoneDigits) {
          phoneEl.textContent = u.phone;
          phoneEl.href = `tel:${u.phoneDigits}`;
        } else {
          phoneEl.textContent = 'Không có SĐT';
          phoneEl.removeAttribute('href');
          phoneEl.classList.remove('text-indigo-600', 'hover:underline');
        }

        const emailEl = node.querySelector('[data-email]');
        if (u.email) {
          emailEl.innerHTML = '';
          const a = document.createElement('a');
          a.href = 'mailto:' + u.email;
          a.textContent = u.email;
          a.className = 'hover:underline';
          emailEl.appendChild(a);
        } else {
          emailEl.classList.add('hidden');
        }

        node.querySelector('[data-gender-chip]').textContent = u.genderText;
        node.querySelector('[data-source-chip]').textContent =
          (u.idType === 'new') ? 'newdata' : (u.idType === 'd2' ? 'data2' : 'data3');
        node.querySelector('[data-diemdon]').textContent = u.diemDon ?? '-';
        node.querySelector('[data-diemdoi]').textContent = u.diemDoi ?? '-';
        node.querySelector('[data-avg]').textContent = u.avg ?? '-';

              const btn = node.querySelector('[data-ach-btn]');
        const profileLink = node.querySelector('[data-profile-link]');

        if (u.idType === 'new' && Number.isInteger(u.id)) {
          // Nút Xem thành tích
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const body = document.getElementById('achBody');
            body.innerHTML = `<div class="text-sm text-slate-600">Đang tải…</div>`;
            openAchModal();
            try {
              const data = await fetchAchievements(u.id);
              renderAchievements(data);
            } catch (err) {
              body.innerHTML = `<p class="text-sm text-red-600">Lỗi tải thành tích: ${err.message}</p>`;
            }
          });

          // Nút Xem hồ sơ – SportConnect
       profileLink.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  // Qua proxy (apispc) để: (1) thêm CORS, (2) bóc data.Html từ JSON thành HTML render được
  const url = `https://apispc.pickletour.vn/account/viewprofile/${u.id}?sportId=2`;
  openProfileModal(url);
});
        } else {
          // Không phải dữ liệu SportConnect: vô hiệu hóa nút thành tích + ẩn nút hồ sơ
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');
          btn.textContent = 'Không có dữ liệu thành tích';

          if (profileLink) {
            profileLink.classList.add('hidden');
          }
        }


        grid.appendChild(node);
      }

      const end = Math.min(start + PAGE_SIZE, state.filtered.length);
      document.getElementById('resultInfo').textContent =
        total ? `Hiển thị ${start + 1}–${end} / ${total}` : 'Không có kết quả';

      const totalPages = Math.max(1, Math.ceil(state.filtered.length / PAGE_SIZE));
      const nav = document.getElementById('pagination');
      nav.innerHTML = '';

      function addBtn(label, page, disabled = false, isActive = false) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = label;
        btn.className =
          `px-3 py-1.5 rounded-lg border text-sm ${
            isActive
              ? 'bg-indigo-600 text-white border-indigo-600'
              : 'bg-white border-slate-200 hover:bg-slate-50'
          } ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`;
        btn.disabled = disabled;
        btn.onclick = () => {
          state.page = page;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        nav.appendChild(btn);
      }

      addBtn('«', 1, state.page === 1);
      addBtn('‹', Math.max(1, state.page - 1), state.page === 1);

      const windowSize = 5;
      const startPage = Math.max(1, state.page - Math.floor(windowSize / 2));
      const endPage = Math.min(totalPages, startPage + windowSize - 1);
      for (let p = Math.max(1, endPage - windowSize + 1); p <= endPage; p++) {
        addBtn(String(p), p, false, p === state.page);
      }

      addBtn('›', Math.min(totalPages, state.page + 1), state.page === totalPages);
      addBtn('»', totalPages, state.page === totalPages);
    }

    function showImage(src) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // Events
    document.getElementById('closeModal').addEventListener('click', () => {
      const modal = document.getElementById('imageModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    document.getElementById('closeAchModal').addEventListener('click', closeAchModal);
    document.addEventListener('click', (e) => { if (e.target.id === 'achModal') closeAchModal(); });

    // Modal hồ sơ: nút X + click ra nền để đóng (gắn ở đây vì DOM đã sẵn sàng)
    document.getElementById('closeProfileModal').addEventListener('click', closeProfileModal);
    document.addEventListener('click', (e) => { if (e.target.id === 'profileModal') closeProfileModal(); });

    // Phím Esc đóng mọi modal đang mở
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      closeProfileModal();
      closeAchModal();
      const im = document.getElementById('imageModal');
      im.classList.add('hidden'); im.classList.remove('flex');
    });

    document.getElementById('q').addEventListener('input', e => {
      state.q = e.target.value;
      applyFilters();
    });
    document.getElementById('province').addEventListener('change', e => {
      state.province = e.target.value;
      applyFilters();
    });
    document.getElementById('gender').addEventListener('change', e => {
      state.gender = e.target.value;
      applyFilters();
    });
    document.getElementById('scoreMin').addEventListener('input', e => {
      state.scoreMin = e.target.value;
      applyFilters();
    });
    document.getElementById('scoreMax').addEventListener('input', e => {
      state.scoreMax = e.target.value;
      applyFilters();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      document.getElementById('q').value = '';
      document.getElementById('province').value = '';
      document.getElementById('gender').value = '';
      document.getElementById('scoreMin').value = '';
      document.getElementById('scoreMax').value = '';
      document.getElementById('source').value = state.source;

      state.q = '';
      state.province = '';
      state.gender = '';
      state.scoreMin = '';
      state.scoreMax = '';

      applyFilters();
    });

    document.getElementById('source').addEventListener('change', e => {
      state.source = e.target.value;
      applySource();
      initFilters();
      applyFilters();
      const label = document.getElementById('sourceLabel');
      if (state.source === 'new') label.textContent = 'newdata.txt';
      else if (state.source === 'd2') label.textContent = 'data2.txt';
      else if (state.source === 'd3') label.textContent = 'data3.txt';
      else if (state.source === 'both') label.textContent = 'newdata.txt + data2.txt';
      else label.textContent = 'newdata.txt + data2.txt + data3.txt';
    });
document.getElementById("toggleFilters").addEventListener("click", () => {
  const box = document.getElementById("filterWrapper");
  box.classList.toggle("hidden");
});
    load();
  </script>
</body>
</html>
